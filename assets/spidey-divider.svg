      <path d="M14 0v7" stroke="#879b98" stroke-width="2"/>
      <rect x="8" y="7" width="12" height="11" fill="#b94c4b" stroke="#18252d" stroke-width="2"/>
      <rect x="10" y="11" width="3" height="2" fill="#f2e9d8"/><rect x="15" y="11" width="3" height="2" fill="#f2e9d8"/>
      <rect x="9" y="18" width="10" height="10" fill="#527c91" stroke="#18252d" stroke-width="2"/>
      <path d="M9 20l-5 3 5 2m10-5l5 3-5 2M10 26l-4 4 5-1m7-3l4 4-5-1" fill="none" stroke="#18252d" stroke-width="2"/>
