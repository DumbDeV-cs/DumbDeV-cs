name: Generate contribution snake

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/snake.yml
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate light and dark snake GIFs
        uses: Platane/snk@v3
        with:
          github_user_name: DumbDeV-cs
          outputs: |
            dist/github-snake-light.gif?palette=github
            dist/github-snake-dark.gif?palette=github-dark
      - name: Publish images to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
