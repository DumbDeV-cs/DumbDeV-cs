name: stealth_weather_pro
description: A polished location based weather app with an on-device file vault.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  geolocator: ^14.0.2
  file_picker: ^13.1.0
  path_provider: ^2.1.6
  flutter_secure_storage: ^11.2.0
  archive: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
