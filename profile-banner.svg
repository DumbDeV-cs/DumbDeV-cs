<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">DumbDeV-cs — learning to code, one small project at a time</title>
  <desc id="description">A cozy dark teal banner with two friendly, hand-drawn cartoon cats and a softly blinking cursor.</desc>
  <rect width="1200" height="360" rx="22" fill="#172d34"/>
  <path d="M0 300c181-27 356-30 543-11 79 8 137 15 205 7v64H0z" fill="#21434a" opacity=".55"/>
  <path d="M65 62v236" stroke="#76d7bb" stroke-width="3" stroke-linecap="round"/>
  <circle cx="65" cy="62" r="5" fill="#f0bc78"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="100" y="111" fill="#a8c9c2" font-size="13" font-weight="600" letter-spacing="2.5">DESKTOP APPS · TINY COMPANIONS</text>
    <text x="96" y="190" fill="#f7f0df" font-size="58" font-weight="700" letter-spacing="-2">DumbDeV-cs</text>
    <text x="100" y="240" fill="#d4e1d9" font-size="22">Learning to code, one small project</text>
    <text x="100" y="271" fill="#d4e1d9" font-size="22">at a time.</text>
    <rect x="204" y="249" width="2.5" height="25" rx="1.2" fill="#f0bc78">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.45;.5;.95;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- A little black-and-white doodle cat -->
  <g stroke="#10191d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- tail -->
    <path d="M823 278c-29 2-43-18-39-39 3-15 15-21 27-17 10 3 12 15 5 21-5 4-12 2-14-3" fill="none" stroke="#26353b" stroke-width="16"/>
    <!-- body -->
    <path d="M829 239c-8-23-3-53 15-68 19-16 55-16 73-1 18 15 23 42 15 69l-6 18H835z" fill="#303e43"/>
    <path d="M847 225c6-13 15-20 27-20 14 0 24 10 29 25l-4 26h-48z" fill="#f3ead7" stroke-width="5"/>
    <path d="M839 261c6 6 19 7 26 1m24 0c7 6 20 5 26-1" fill="none" stroke="#10191d" stroke-width="6"/>
    <!-- head, ears -->
    <path d="M819 155c-5-17-4-39 2-52l29 18c14-6 32-6 46 0l28-20c8 17 9 39 4 56 11 12 15 28 12 43-4 28-27 45-65 45-39 0-62-17-66-45-3-17 1-33 10-45z" fill="#303e43"/>
    <path d="M832 118l16 10-13 13c-4-7-5-15-3-23zm75 0-15 10 13 13c4-7 5-15 2-23z" fill="#d78f94" stroke="none"/>
    <!-- face -->
    <ellipse cx="844" cy="165" rx="5" ry="7" fill="#f0bc78" stroke="none"/>
    <path d="M892 160c0 6-2 10-6 10s-6-4-6-10 2-8 6-8 6 2 6 8z" fill="#f0bc78" stroke="none"/>
    <path d="M862 181l7 5 7-5-7-5z" fill="#d98f91" stroke="none"/>
    <path d="M869 186c-1 8-8 10-13 6m13-6c1 8 8 10 13 6" fill="none" stroke="#f3ead7" stroke-width="3.5"/>
    <path d="M855 185l-23-4m23 11-25 4m59-11 23-4m-23 11 25 4" fill="none" stroke="#d7d2c4" stroke-width="2.5"/>
  </g>

  <!-- A warm ginger cat with one curious raised ear -->
  <g stroke="#10191d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- curled tail -->
    <path d="M1034 276c-32 3-44-14-38-32 5-15 23-18 31-8 6 8 1 17-7 17-4 0-7-3-7-7" fill="none" stroke="#d98755" stroke-width="16"/>
    <!-- body and paws -->
    <path d="M1038 239c-8-25-1-52 17-67 17-15 51-15 68 0 17 15 21 43 13 68l-5 17h-88z" fill="#e9aa70"/>
    <path d="M1055 227c6-15 15-21 26-21s21 8 26 23l-4 23h-45z" fill="#f7e9cf" stroke-width="5"/>
    <path d="M1047 259c7 8 19 8 26 1m27 0c6 7 18 7 25-1" fill="none" stroke="#10191d" stroke-width="6"/>
    <!-- head and ears -->
    <path d="M1028 155c-5-17-3-40 3-54l29 20c14-7 32-7 46 0l28-21c8 17 9 39 4 56 10 12 14 27 11 44-5 28-28 45-65 45-38 0-62-17-66-45-3-17 1-33 10-45z" fill="#e9aa70"/>
    <path d="M1041 120l16 11-13 13c-4-8-5-16-3-24zm75 0-15 11 13 13c4-8 5-16 2-24z" fill="#d9878e" stroke="none"/>
    <!-- forehead stripe, eyes and smile -->
    <path d="M1071 129l-7 12m20-15-2 14m19-11 4 12" fill="none" stroke="#bc724d" stroke-width="4"/>
    <path d="M1053 164c0 5-2 8-6 8s-6-3-6-8 2-8 6-8 6 3 6 8zm52 0c0 5-2 8-6 8s-6-3-6-8 2-8 6-8 6 3 6 8z" fill="#263a3a" stroke="none"/>
    <path d="M1070 183l7 5 7-5-7-5z" fill="#b96168" stroke="none"/>
    <path d="M1077 188c-1 8-8 10-13 6m13-6c1 8 8 10 13 6" fill="none" stroke="#76594c" stroke-width="3.5"/>
    <path d="M1063 187l-20-4m20 11-21 4m55-11 20-4m-20 11 21 4" fill="none" stroke="#9a6c55" stroke-width="2.5"/>
  </g>

  <!-- A few hand-drawn accents, kept small and out of the text -->
  <path d="M786 107l5-8 4 8m162 16 5-8 4 8m196 72 4-7 5 7" fill="none" stroke="#f0bc78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="975" cy="93" r="3" fill="#80d8bd"/>
  <circle cx="1157" cy="115" r="3" fill="#80d8bd"/>
</svg>
