      <stop offset="0" stop-color="#70e4e9"/>
      <stop offset="1" stop-color="#a6f3ce"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#aac9df" stroke-opacity=".055" stroke-width="1"/>
