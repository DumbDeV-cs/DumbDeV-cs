<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="title desc">
  <title id="title">A small pixel-art desk scene</title>
  <desc id="desc">A little robot and cat hang out by a window while I learn to code.</desc>
  <rect width="1000" height="280" rx="18" fill="#f2eadc"/>
  <rect x="0" y="194" width="1000" height="86" fill="#d8c8ad"/>
  <path d="M0 194h1000M0 205h1000" stroke="#b9a789" stroke-width="4"/>
  <rect x="68" y="38" width="300" height="126" rx="8" fill="#d3e6df" stroke="#526c65" stroke-width="8"/>
  <path d="M218 42v118M72 102h292" stroke="#526c65" stroke-width="6"/>
  <rect x="88" y="58" width="90" height="36" fill="#a8c9c4"/><rect x="244" y="58" width="98" height="36" fill="#c2d9cc"/>
  <rect x="88" y="116" width="90" height="32" fill="#e7d2a6"/><rect x="244" y="116" width="98" height="32" fill="#b5c9ad"/>
  <text x="430" y="96" fill="#485b4d" font-family="Consolas, monospace" font-size="18">currently figuring things out</text>
  <text x="426" y="148" fill="#293b35" font-family="Consolas, monospace" font-size="42" font-weight="700">learning as I go</text>
  <text x="430" y="178" fill="#657166" font-family="Consolas, monospace" font-size="15">one little project at a time</text>
  <!-- little robot on the desk -->
  <g stroke="#334b48" stroke-width="6" stroke-linejoin="round">
    <path d="M746 110h88v70h-88z" fill="#91c7c1"/><path d="M767 180v20m48-20v20" fill="none"/>
    <path d="M775 138h8m22 0h8" stroke="#334b48" stroke-width="8"/><path d="M774 157h32" stroke="#47756e" stroke-width="5"/>
    <path d="M790 110V94"/><rect x="784" y="82" width="12" height="12" fill="#e7b45d"/>
  </g>
  <!-- sleepy pixel cat -->
  <g stroke="#4b443f" stroke-width="6" stroke-linejoin="round">
    <path d="M872 139v-34l22 13q17-9 34 0l22-13v34q0 39-39 39t-39-39z" fill="#706a68"/>
    <path d="M889 141h8m26 0h8" stroke="#f3e6c8" stroke-width="7"/><path d="M907 153l-5 5h10z" fill="#d89b86"/>
    <path d="M883 178v20m49-20v20" fill="none"/><path d="M950 163q24 0 17-23" fill="none"/>
  </g>
  <rect x="728" y="202" width="220" height="8" fill="#9c8767"/>
  <rect x="0" y="0" width="1000" height="280" rx="18" fill="none" stroke="#e5dac8" stroke-width="3"/>
</svg>
