<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">DumbDeV-cs — learning to code, one small project at a time</title>
  <desc id="description">A dark teal profile banner with two decorative pixel-style cats, warm accent pixels, and a softly blinking cursor.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111b2a"/>
      <stop offset="1" stop-color="#142f36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#82dfc1"/>
      <stop offset="1" stop-color="#f3bf7b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
  <path d="M0 285c186-45 340-49 514-22 66 10 122 20 187 14v83H0z" fill="#21434a" opacity=".22"/>
  <path d="M62 62v236" stroke="#7edfc2" stroke-width="2" opacity=".8"/>
  <path d="M63 62h34" stroke="#f1bd79" stroke-width="2"/>

  <g font-family="Segoe UI, Arial, sans-serif" shape-rendering="auto">
    <text x="104" y="112" fill="#a8c9c2" font-size="13" font-weight="600" letter-spacing="3">SMALL PROJECTS · TINY COMPANIONS</text>
    <text x="100" y="190" fill="#f5f3ed" font-size="58" font-weight="700" letter-spacing="-2">DumbDeV-cs</text>
    <text x="104" y="239" fill="#d3e2dc" font-size="22">Learning to code, one small project</text>
    <text x="104" y="271" fill="#d3e2dc" font-size="22">at a time<tspan fill="#f1bd79">.</tspan></text>
    <rect x="218" y="249" width="2" height="26" rx="1" fill="#f1bd79">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.45;.5;.95;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="104" y="300" width="56" height="3" rx="1.5" fill="url(#accent)"/>
  </g>

  <!-- Original pixel-style black cat mascot -->
  <g aria-label="Black pixel-style cat" transform="translate(0 0)" shape-rendering="crispEdges">
    <!-- tail -->
    <path d="M824 252h-12v-12h12v-12h12v12h12v12h-12v12h-12z" fill="#202b3b"/>
    <!-- body and paws -->
    <path d="M838 207h84v12h12v48h-12v12h-12v12h-24v-12h-12v12h-24v-12h-12v-12h-12v-48h12z" fill="#202b3b"/>
    <path d="M850 221h60v36h-60z" fill="#29394a"/>
    <path d="M850 267h24v12h-24zM898 267h24v12h-24z" fill="#e7a968"/>
    <!-- head and ears -->
    <path d="M838 145v-24h12v-12h24v12h36v-12h24v12h12v24h12v48h-12v12h-96v-12h-12v-48z" fill="#202b3b"/>
    <path d="M850 145v-12h12v12h-12zM922 145v-12h12v12h-12z" fill="#d98798"/>
    <path d="M850 145h84v48h-84z" fill="#29394a"/>
    <!-- face -->
    <path d="M862 157h8v12h-8zM914 157h8v12h-8z" fill="#8de0c1"/>
    <path d="M886 177h8v6h-8z" fill="#ef9e9b"/>
    <path d="M878 189h8v6h16v-6h8v8h-8v6h-16v-6h-8z" fill="#d7c4ba"/>
    <!-- collar -->
    <path d="M862 207h36v8h-36z" fill="#e9aa68"/>
  </g>

  <!-- Original pixel-style cream cat mascot -->
  <g aria-label="Cream pixel-style cat" transform="translate(0 0)" shape-rendering="crispEdges">
    <!-- tail -->
    <path d="M1021 250h-12v-12h12v-12h12v12h12v12h-12v12h-12z" fill="#c5a879"/>
    <!-- body and paws -->
    <path d="M1035 207h84v12h12v48h-12v12h-12v12h-24v-12h-12v12h-24v-12h-12v-12h-12v-48h12z" fill="#dfc99e"/>
    <path d="M1047 221h60v36h-60z" fill="#ead8b5"/>
    <path d="M1047 267h24v12h-24zM1095 267h24v12h-24z" fill="#83cbb9"/>
    <!-- head and ears -->
    <path d="M1035 145v-24h12v-12h24v12h36v-12h24v12h12v24h12v48h-12v12h-96v-12h-12v-48z" fill="#dfc99e"/>
    <path d="M1047 145v-12h12v12h-12zM1119 145v-12h12v12h-12z" fill="#d98f93"/>
    <path d="M1047 145h84v48h-84z" fill="#ead8b5"/>
    <!-- face -->
    <path d="M1059 157h8v12h-8zM1111 157h8v12h-8z" fill="#2d4547"/>
    <path d="M1083 177h8v6h-8z" fill="#d98f93"/>
    <path d="M1075 189h8v6h16v-6h8v8h-8v6h-16v-6h-8z" fill="#876d62"/>
    <!-- tiny neck bow -->
    <path d="M1083 207h8v8h-8zM1075 207h8v8h-8zM1091 207h8v8h-8z" fill="#83cbb9"/>
  </g>

  <!-- A few quiet pixels to tie the characters into the background -->
  <g fill="#f1bd79">
    <rect x="795" y="107" width="6" height="6"/>
    <rect x="984" y="136" width="4" height="4" opacity=".8"/>
    <rect x="1149" y="185" width="6" height="6" opacity=".9"/>
  </g>
  <g fill="#86ddc0">
    <rect x="1005" y="94" width="4" height="4"/>
    <rect x="1152" y="105" width="4" height="4" opacity=".75"/>
  </g>
</svg>
