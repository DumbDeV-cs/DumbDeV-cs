<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="title desc">
  <title id="title">DumbDeV-cs — building with curiosity</title>
  <desc id="desc">A midnight-blue pixel-inspired banner with a web motif, a friendly robot, and a black cat.</desc>
  <defs>
